# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

ci = { autoupdate_schedule = "monthly" }

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.13.0"
hooks = [{ id = "air-format" }]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-added-large-files", args = ["--maxkb=200"], exclude = '^data/.*\.rda$' }, { id = "file-contents-sorter", files = '^\.Rbuildignore$' }, { id = "check-case-conflict" }, { id = "check-merge-conflict" }, { id = "check-shebang-scripts-are-executable" }, { id = "check-symlinks" }, { id = "check-toml" }, { id = "check-xml" }, { id = "check-yaml" }, { id = "mixed-line-ending" }, { id = "end-of-file-fixer", exclude = '\.Rd' }, { id = "trailing-whitespace" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.10.0"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.17.2"
hooks = [{ id = "panache-format" }, { id = "panache-lint" }]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "1.0.0"
hooks = [{ id = "jarl-check" }]

[[repos]]
repo = "local"
hooks = [
  { id = "forbid-r-artifacts", name = "Don't commit R workspace files", entry = "Cannot commit .Rhistory, .RData, .Rds or .rds.", language = "fail", files = '\.(Rhistory|RData|Rds|rds)$' },
  { id = "no-browser-statement", name = "Forbid browser() calls", entry = '\bbrowser\s*\(', language = "pygrep", files = '^(R|tests|data-raw)/.*\.[rR]$' },
  { id = "no-debug-statement", name = "Forbid debug()/debugonce() calls", entry = '\bdebug(once)?\s*\(', language = "pygrep", files = '^(R|tests|data-raw)/.*\.[rR]$' },
  { id = "no-print-statement", name = "Forbid print() calls in R/", entry = '\bprint\s*\(', language = "pygrep", files = '^R/.*\.[rR]$' },
]
