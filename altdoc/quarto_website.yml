---
project:
  output-dir: ../docs/
  type: website

website:
  title: "$ALTDOC_PACKAGE_NAME"
  site-url: https://spectra-to-knowledge.github.io/SpectraToQueries/
  favicon: man/figures/logo.svg
  image: man/figures/logo.svg
  page-navigation: true
  navbar:
    title: SpectraToQueries
    description: Repository to translate spectra to queries
    logo: man/figures/logo.svg
    logo-alt: SpectraToQueries logo
    search: true
    left:
      - text: News
        file: $ALTDOC_NEWS
      - text: License
        file: $ALTDOC_LICENSE
      - text: Citation
        file: $ALTDOC_CITATION
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  page-footer: |
    <div style="display: flex; justify-content: center;">
    <a href="https://www.simpleanalytics.com?utm_source=spectra-to-knowledge.github.io&utm_content=badge" referrerpolicy="origin" target="_blank" rel="noopener noreferrer">
      <picture>
        <source
          srcset="https://simpleanalyticsbadges.com/spectra-to-knowledge.github.io?mode=dark&counter=false&radius=10&background-dark=0a0f19&text-dark=b8c5d6&logo-dark=d69999"
          media="(prefers-color-scheme: dark)"
        />
        <img
          src="https://simpleanalyticsbadges.com/spectra-to-knowledge.github.io?mode=light&counter=false&radius=10&background-light=f7fafc&text-light=4a5a6d&logo-light=990000"
          alt="Simple Analytics" width="118" height="28" loading="lazy"
          referrerpolicy="no-referrer"
          crossorigin="anonymous"
        />
      </picture>
    </a>
    </div>
  body-header: |
    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

format:
  html:
    grid:
      body-width: 1200px
    linkcolor: "#3377c4"
    respect-user-color-scheme: true
    toc: true
